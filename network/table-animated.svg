<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -24 488 488" width="488" height="488" role="img" aria-label="A round table with seven chairs pulled in and one mint chair pulled out, waiting for you."><style>
.chair{transform-box:fill-box;transform-origin:50% 50%}
.c0{animation:scoot 9s ease-in-out infinite 0s}.c1{animation:scoot 9s ease-in-out infinite 1.6s}.c3{animation:scoot 9s ease-in-out infinite 3.4s}
.c4{animation:scoot 9s ease-in-out infinite 5.1s}.c5{animation:scoot 9s ease-in-out infinite 2.5s}.c6{animation:scoot 9s ease-in-out infinite 6.6s}.c7{animation:scoot 9s ease-in-out infinite 4.2s}
@keyframes scoot{0%,82%,100%{transform:translateY(0)}88%{transform:translateY(-3px)}94%{transform:translateY(1px)}}
.mint{animation:invite 4.8s cubic-bezier(.45,0,.25,1) infinite}
@keyframes invite{0%,100%{transform:translateY(0) rotate(0)}38%{transform:translateY(-9px) rotate(-5deg)}52%{transform:translateY(-9px) rotate(-5deg)}76%{transform:translateY(1px) rotate(1deg)}}
.seat{animation:spin 6s linear infinite}
@keyframes spin{to{stroke-dashoffset:-32}}
.pulse{transform-box:fill-box;transform-origin:50% 50%;animation:pulse 2.4s ease-out infinite;opacity:0}
@keyframes pulse{0%{transform:scale(1);opacity:.55}100%{transform:scale(2.1);opacity:0}}
.tick{stroke-dasharray:22;stroke-dashoffset:22;animation:tick 6s ease-in-out infinite}
@keyframes tick{0%,8%{stroke-dashoffset:22}22%,88%{stroke-dashoffset:0}100%{stroke-dashoffset:22}}
.steam{opacity:0}
.steam path{animation:rise 3.6s ease-out infinite}
.s1 path{animation-delay:0s}.s2 path{animation-delay:1.2s}.s3 path{animation-delay:2.4s}
.steam{opacity:1}
@keyframes rise{0%{opacity:0;transform:translateY(4px)}30%{opacity:.9}100%{opacity:0;transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.tick{stroke-dashoffset:0}.pulse,.steam path{opacity:0}}
